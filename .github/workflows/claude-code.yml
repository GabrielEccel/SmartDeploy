      - name: Take a metadata snapshot
        if: ${{ github.event.inputs.task == 'snapshot' }}
        timeout-minutes: 75
        env:
          SD_HUB_AUTH_URL: ${{ secrets.SD_HUB_AUTH_URL }}
          SF_AUTH_ACCOUNT: ${{ secrets.SF_AUTH_ACCOUNT }}
          SF_AUTH_PARTIAL: ${{ secrets.SF_AUTH_PARTIAL }}
        run: |
          set +e
          mkdir -p "$FOLDER/deploy"
          RESULT="$FOLDER/deploy/$STEP.snapshot.json"
          CODE_FILE="$FOLDER/deploy/$STEP.snapshot.code"
          WORK="$RUNNER_TEMP/smart-deploy"
          rm -rf "$WORK" && mkdir -p "$WORK"
          RUN_FILE="$FOLDER/run/$STEP.$TASK.json"
          fail() {
            echo "ERROR: $1"
            jq -n --arg m "$1" '{status: 1, name: "SmartDeployError", message: $m}' > "$RESULT"
            echo 1 > "$CODE_FILE"
            exit 1
          }
          ENV_KEY=$(jq -r '.environmentKey // empty' "$RUN_FILE" 2>/dev/null)
          [[ "$ENV_KEY" =~ ^[A-Za-z0-9]{15,18}$ ]] || fail "The run options at $RUN_FILE name no environment."
          BRANCH=$(jq -r '.branch // empty' "$RUN_FILE" 2>/dev/null)
          if [ -n "$BRANCH" ]; then
            [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] && [[ "$BRANCH" != *..* ]] || fail "$BRANCH is not a branch name the copy can be pushed to."
            [ "$BRANCH" != "${GITHUB_REF_NAME:-$CI_COMMIT_REF_NAME}" ] || fail "$BRANCH is the branch the runner works on."
          fi
          publishBranch() {
            ENV_NAME=$(jq -r '.environmentName // "the environment"' "$RUN_FILE" 2>/dev/null)
            echo "Converting $(grep -c '<members>' "$WORK/snapshot.xml") component(s) to source format"
            (cd "$WORK/project" && sf project convert mdapi --root-dir "$WORK/snapshot/pkg" --json) > "$WORK/convert.json" 2>&1 || fail "Could not convert the metadata to source format: $(jq -r '.message // empty' "$WORK/convert.json" 2>/dev/null)"
            if [ -n "$CI_SERVER_HOST" ] && [ -n "$SMART_DEPLOY_PUSH_TOKEN" ]; then
              git remote set-url origin "$CI_SERVER_PROTOCOL://oauth2:$SMART_DEPLOY_PUSH_TOKEN@$CI_SERVER_HOST:$CI_SERVER_PORT/$CI_PROJECT_PATH.git"
            fi
            git config core.quotePath false
            TREE="$RUNNER_TEMP/smart-deploy-branch"
            rm -rf "$TREE"
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              git fetch -q --depth 1 origin "+refs/heads/$BRANCH:refs/smart-deploy/branch" || fail "Could not fetch $BRANCH."
              git worktree add -q --detach "$TREE" refs/smart-deploy/branch || fail "Could not check out $BRANCH."
            else
              echo "$BRANCH does not exist yet; it starts with this copy."
              git worktree add -q --detach "$TREE" HEAD || fail "Could not prepare $BRANCH."
              (cd "$TREE" && git checkout -q --orphan smart-deploy-copy && git rm -rfq --ignore-unmatch .) || fail "Could not prepare $BRANCH."
            fi
            rm -rf "$TREE/force-app"
            cp -R "$WORK/project/force-app" "$TREE/force-app"
            [ -f "$TREE/sfdx-project.json" ] || cp "$WORK/project/sfdx-project.json" "$TREE/sfdx-project.json"
            mkdir -p "$TREE/manifest" && cp "$WORK/snapshot.xml" "$TREE/manifest/package.xml"
            git -C "$TREE" add -A
            if git -C "$TREE" diff --staged --quiet; then
              echo "$BRANCH already matches $ENV_NAME."
            else
              git -C "$TREE" -c user.name="smart-deploy" -c user.email="smart-deploy@users.noreply.github.com" commit -q -m "Smart Deploy: copy of $ENV_NAME as of $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git -C "$TREE" push -q origin "HEAD:refs/heads/$BRANCH" > "$WORK/push.log" 2>&1 || fail "Could not push the copy to $BRANCH: $(tail -n 3 "$WORK/push.log")"
              echo "$ENV_NAME copied to $BRANCH"
            fi
            git worktree remove --force "$TREE" || true
          }
          login() {
            if [ -z "$2" ]; then fail "No $1 credential was named. Set a Deploy Secret Name or a Token Credential on that environment."; fi
            case "$2" in
              sd-ticket:*)
                if [ -z "${SD_HUB_AUTH_URL:-}" ]; then fail "The $1 credential is kept by the Smart Deploy hub, and the runner has no SD_HUB_AUTH_URL secret to reach it. Create a repository secret of that name holding the hub org sfdx auth URL."; fi
                HUB_AUTH="${SD_HUB_AUTH_URL#force://}"
                HUB_CLIENT="${HUB_AUTH%%:*}"; HUB_AUTH="${HUB_AUTH#*:}"
                HUB_CLIENT_SECRET="${HUB_AUTH%%:*}"; HUB_AUTH="${HUB_AUTH#*:}"
                HUB_REFRESH="${HUB_AUTH%@*}"; HUB_HOST="${HUB_AUTH##*@}"
                case "$HUB_HOST" in http*) HUB_BASE="$HUB_HOST" ;; *) HUB_BASE="https://$HUB_HOST" ;; esac
                if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::add-mask::$HUB_REFRESH"; fi
                curl -sS -o "$WORK/hub-token.json" -X POST "$HUB_BASE/services/oauth2/token" --data-urlencode "grant_type=refresh_token" --data-urlencode "client_id=$HUB_CLIENT" ${HUB_CLIENT_SECRET:+--data-urlencode "client_secret=$HUB_CLIENT_SECRET"} --data-urlencode "refresh_token=$HUB_REFRESH"
                HUB_TOKEN=$(jq -r ".access_token // empty" "$WORK/hub-token.json" 2> /dev/null)
                HUB_URL=$(jq -r ".instance_url // empty" "$WORK/hub-token.json" 2> /dev/null)
                HUB_REFUSED=$(jq -r ".error_description // .error // empty" "$WORK/hub-token.json" 2> /dev/null)
                rm -f "$WORK/hub-token.json"
                unset HUB_AUTH HUB_REFRESH HUB_CLIENT_SECRET
                if [ -z "$HUB_TOKEN" ] || [ -z "$HUB_URL" ]; then fail "The hub org refused the SD_HUB_AUTH_URL credential. ${HUB_REFUSED}"; fi
                if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::add-mask::$HUB_TOKEN"; fi
                jq -n --arg t "${2#sd-ticket:}" "{ticket: \$t}" > "$WORK/ticket.json"
                HTTP=$(curl -sS -o "$WORK/token.json" -w "%{http_code}" -X POST "$HUB_URL/services/apexrest/smartcloudbrc/SmartDeploy/Token" -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" --data @"$WORK/ticket.json")
                rm -f "$WORK/ticket.json"
                ACCESS=$(jq -r ".accessToken // empty" "$WORK/token.json" 2> /dev/null)
                INSTANCE=$(jq -r ".instanceUrl // empty" "$WORK/token.json" 2> /dev/null)
                if [ -n "$ACCESS" ] && [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::add-mask::$ACCESS"; fi
                REFUSED=$(jq -r ".error // empty" "$WORK/token.json" 2> /dev/null)
                rm -f "$WORK/token.json"
                if [ -z "$ACCESS" ] || [ -z "$INSTANCE" ]; then fail "The hub did not hand over the $1 credential (HTTP $HTTP). ${REFUSED}"; fi
                SF_ACCESS_TOKEN="$ACCESS" sf org login access-token --instance-url "$INSTANCE" --alias "$1" --no-prompt > /dev/null || fail "The $1 org refused the token the hub handed over."
                unset ACCESS HUB_TOKEN
                ;;
              *)
                AUTH_URL="${!2:-}"
                if [ -z "$AUTH_URL" ]; then fail "No credential behind '$2'. Create a repository secret of exactly that name holding the org sfdx auth URL, then run the step again."; fi
                printf "%s" "$AUTH_URL" > "$WORK/auth.txt"
                sf org login sfdx-url --sfdx-url-file "$WORK/auth.txt" --alias "$1" > /dev/null || { rm -f "$WORK/auth.txt"; fail "The $1 org refused the credential in '$2'."; }
                rm -f "$WORK/auth.txt"
                ;;
            esac
          }
          login target "$AUTH_SECRET"
          DAY=$(date -u +%Y-%m-%d)
          DEST="snapshots/$ENV_KEY/$DAY"
          echo "Listing everything the org holds"
          mkdir -p "$WORK/project/force-app"
          printf '%s' '{"packageDirectories":[{"path":"force-app","default":true}],"sourceApiVersion":"67.0"}' > "$WORK/project/sfdx-project.json"
          (cd "$WORK/project" && sf project generate manifest --from-org target --output-dir "$WORK" --name snapshot) > "$WORK/manifest.log" 2>&1 || fail "Could not list the org metadata: $(tail -n 5 "$WORK/manifest.log")"
          echo "Retrieving $(grep -c '<members>' "$WORK/snapshot.xml") component(s)"
          sf project retrieve start --manifest "$WORK/snapshot.xml" --target-org target --target-metadata-dir "$WORK/snapshot" --unzip --single-package --zip-file-name pkg --wait 60 --json > "$WORK/retrieve.json"
          CODE=$?
          jq '{status, message, result: {status: .result.status, fileCount: ((.result.files // []) | length)}}' "$WORK/retrieve.json" > "$RESULT" 2>/dev/null || cp "$WORK/retrieve.json" "$RESULT"
          if [ "$CODE" -eq 0 ] && [ -n "$BRANCH" ]; then
            publishBranch
          elif [ "$CODE" -eq 0 ]; then
            rm -rf "$DEST" && mkdir -p "$DEST"
            cp -R "$WORK/snapshot/pkg/." "$DEST/"
            echo "Snapshot written to $DEST"
          fi
          KEEP=$(jq -r '.retentionDays // 0' "$RUN_FILE" 2>/dev/null)
          [ -z "$BRANCH" ] || KEEP=0
          if [[ "$KEEP" =~ ^[0-9]+$ ]] && [ "$KEEP" -gt 0 ]; then
            OLDEST=$(date -u -d "-$KEEP days" +%Y-%m-%d)
            for OLD in "snapshots/$ENV_KEY"/*/; do
              [ -d "$OLD" ] || continue
              OLD_DAY=$(basename "$OLD")
              if [[ "$OLD_DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$OLD_DAY" < "$OLDEST" ]]; then
                echo "Removing the snapshot of $OLD_DAY, older than $KEEP day(s)"
                rm -rf "$OLD"
              fi
            done
          fi
          echo "$CODE" > "$CODE_FILE"
          exit "$CODE"

      - name: Record the baseline
        if: ${{ success() && github.event.inputs.validate_only != 'true' && (github.event.inputs.task == 'promote' || github.event.inputs.task == 'rollback' || github.event.inputs.task == 'restore') }}
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set +e
          WORK="$RUNNER_TEMP/smart-deploy"
          BASE_WORK="$RUNNER_TEMP/smart-deploy-baseline"
          rm -rf "$BASE_WORK" && mkdir -p "$BASE_WORK"
          RUN_FILE="$FOLDER/run/$STEP.$TASK.json"
          ENV_KEY=$(jq -r '.environmentKey // empty' "$RUN_FILE" 2>/dev/null)
          if ! [[ "$ENV_KEY" =~ ^[A-Za-z0-9]{15,18}$ ]]; then
            echo "The run options name no environment, so no baseline is recorded."
            exit 0
          fi
          if [ ! -f "$WORK/deployed.xml" ] || ! grep -q '<members>' "$WORK/deployed.xml"; then
            echo "Nothing was deployed that a baseline could hold."
            exit 0
          fi
          BASE="baselines/$ENV_KEY"
          echo "Recording what the environment holds now under $BASE"
          sf project retrieve start --manifest "$WORK/deployed.xml" --target-org target --target-metadata-dir "$BASE_WORK" --unzip --single-package --zip-file-name pkg --wait 20 --json > "$BASE_WORK/retrieve.json"
          if [ $? -ne 0 ]; then
            echo "::warning::The baseline could not be retrieved: $(jq -r '.message // "see the log"' "$BASE_WORK/retrieve.json")"
            exit 0
          fi
          node "$RUNNER_TEMP/sd-manifest.js" prune "$BASE_WORK/retrieve.json" "$BASE_WORK/pkg" "$BASE_WORK/none.xml" > /dev/null
          rm -f "$BASE_WORK/pkg/destructiveChangesPost.xml"
          mkdir -p "$BASE"
          if [ -f "$BASE/package.xml" ]; then cp "$BASE/package.xml" "$BASE_WORK/previous.xml"; fi
          node "$RUNNER_TEMP/sd-xml.js" absorb "$BASE_WORK/pkg" "$BASE"
          node "$RUNNER_TEMP/sd-manifest.js" union "$BASE/package.xml" "$BASE_WORK/previous.xml" "$BASE_WORK/pkg/package.xml" > /dev/null
          if [ -f "$WORK/removed.xml" ]; then node "$RUNNER_TEMP/sd-xml.js" forget "$BASE" "$WORK/removed.xml"; fi
          jq -n --arg release "$RELEASE" --arg task "$TASK" --arg step "$STEP" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{release: $release, task: $task, step: $step, recordedAt: $at}' > "$BASE/baseline.json"
          echo "Baseline recorded: $(grep -c '<members>' "$BASE/package.xml") component(s)."

      - name: Commit what came back
        if: ${{ !cancelled() }}
        run: |
          git config user.name "smart-deploy"
          git config user.email "smart-deploy@users.noreply.github.com"
          git config core.quotePath false
          stage() {
            git add -A "$FOLDER"
            for EXTRA in baselines snapshots; do
              if [ -e "$EXTRA" ] || [ -n "$(git ls-files "$EXTRA" | head -n 1)" ]; then git add -A "$EXTRA"; fi
            done
          }
          stage
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          SAVE="$RUNNER_TEMP/smart-deploy-save"
          rm -rf "$SAVE" && mkdir -p "$SAVE/files"
          git diff --staged --name-only -z --no-renames --diff-filter=d > "$SAVE/changed.txt"
          git diff --staged --name-only -z --no-renames --diff-filter=D > "$SAVE/removed.txt"
          while IFS= read -r -d "" FILE; do mkdir -p "$SAVE/files/$(dirname "$FILE")" && cp "$FILE" "$SAVE/files/$FILE"; done < "$SAVE/changed.txt"
          git commit -q -m "Smart Deploy: $TASK $STEP for $RELEASE"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "The push was refused (attempt $attempt of 5); rebasing onto the latest $GITHUB_REF_NAME."
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "Another run wrote the same files; replaying this run onto the latest $GITHUB_REF_NAME."
              git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD || { echo "ERROR: could not fetch $GITHUB_REF_NAME."; exit 1; }
              while IFS= read -r -d "" FILE; do
                mkdir -p "$(dirname "$FILE")"
                case "$FILE" in
                  baselines/*/package.xml)
                    git show "FETCH_HEAD:$FILE" > "$SAVE/remote.xml" 2>/dev/null || : > "$SAVE/remote.xml"
                    cp "$SAVE/files/$FILE" "$FILE"
                    if [ -s "$SAVE/remote.xml" ] && [ -f "$RUNNER_TEMP/sd-manifest.js" ]; then
                      node "$RUNNER_TEMP/sd-manifest.js" union "$FILE" "$FILE" "$SAVE/remote.xml" > /dev/null
                    fi
                    ;;
                  *) cp "$SAVE/files/$FILE" "$FILE" ;;
                esac
              done < "$SAVE/changed.txt"
              while IFS= read -r -d "" FILE; do rm -f "$FILE"; done < "$SAVE/removed.txt"
              stage
              git diff --staged --quiet || git commit -q -m "Smart Deploy: $TASK $STEP for $RELEASE"
            fi
            sleep $((attempt * 5))
          done
          echo "ERROR: could not push after 5 attempts."
          exit 1
