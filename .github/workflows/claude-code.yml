name: Smart Deploy — Change Record
# Generated by SD_GitHubDispatcher. Edits are overwritten on the next
# dispatch — change the Apex builder (workflowYaml) instead.

run-name: Smart Deploy ${{ github.event.inputs.task }} ${{ github.event.inputs.step }} ${{ github.event.inputs.release }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: The release being documented
        required: true
      folder:
        description: Where its manifest and draft were committed
        required: true
      task:
        description: change-record, prompts, promote, rollback, restore or snapshot
        required: false
        default: change-record
      step:
        description: Which stop of the path this run is for; - when not a promote
        required: false
        default: '-'
      auth_secret:
        description: Name of the repository secret holding the TARGET org auth URL
        required: false
      source_secret:
        description: Name of the repository secret holding the SOURCE org auth URL
        required: false
      validate_only:
        description: true to check the deployment without writing to the org
        required: false
        default: 'false'
      test_level:
        description: Apex test level for a promote
        required: false
        default: NoTestRun
      quick_deploy_id:
        description: A validated deploy id to quick-deploy instead of deploying again
        required: false
      claude_code_oauth_token:
        description: Leave blank to use the CLAUDE_CODE_OAUTH_TOKEN secret
        required: false

permissions:
  contents: write

concurrency:
  group: smart-deploy-${{ github.event.inputs.folder }}-${{ github.event.inputs.step }}
  cancel-in-progress: false

jobs:
  change-record:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ github.event.inputs.claude_code_oauth_token || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      RELEASE: ${{ github.event.inputs.release }}
      FOLDER: ${{ github.event.inputs.folder }}
      TASK: ${{ github.event.inputs.task }}
      TEST_LEVEL: ${{ github.event.inputs.test_level }}
      VALIDATE_ONLY: ${{ github.event.inputs.validate_only }}
      QUICK_DEPLOY_ID: ${{ github.event.inputs.quick_deploy_id }}
      STEP: ${{ github.event.inputs.step }}
      AUTH_SECRET: ${{ github.event.inputs.auth_secret }}
      SOURCE_SECRET: ${{ github.event.inputs.source_secret }}
      SF_DISABLE_TELEMETRY: 'true'
      SF_AUTOUPDATE_DISABLE: 'true'
      PMD_VERSION: '7.13.0'
    steps:
      - name: Mask the token
        run: |
          [ -n "${{ github.event.inputs.claude_code_oauth_token }}" ] && echo "::add-mask::${{ github.event.inputs.claude_code_oauth_token }}" || true

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Point npm at a cacheable prefix
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Restore the CLI from cache
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: smart-deploy-cli-v2-${{ runner.os }}-node22

      - name: Install the CLIs
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: npm i -g --no-audit --no-fund @anthropic-ai/claude-code @salesforce/cli

      - name: Check the token
        if: ${{ github.event.inputs.task == 'prompts' || github.event.inputs.task == 'change-record' }}
        run: |
          unset ANTHROPIC_API_KEY
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "ERROR: no Claude Code token. Fill it in Smart Deploy Settings or set the CLAUDE_CODE_OAUTH_TOKEN repository secret."
            exit 1
          fi

      - name: Run the static analysis
        if: ${{ github.event.inputs.task == 'prompts' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          SRC="$FOLDER/metadata"
          SA_DIR="$FOLDER/analysis"
          SA_REPORT="$SA_DIR/static-analysis.md"
          SA_WORK="$RUNNER_TEMP/sd-static"
          rm -rf "$SA_WORK" && mkdir -p "$SA_WORK" "$SA_DIR"
          rm -f "$SA_REPORT" "$SA_DIR/code-analyzer.json" "$SA_DIR/eslint.json"
          {
            echo "# Static analysis"
            echo
            echo "Deterministic tools, run on the files of this release before the AI: PMD through Salesforce Code Analyzer (sf code-analyzer run) for Apex, and ESLint with @salesforce/eslint-config-lwc for Lightning Web Components."
            echo
            echo "## Apex: PMD (Salesforce Code Analyzer)"
            echo
          } > "$SA_REPORT"
          TARGETS=()
          for KIND in ApexClass ApexTrigger; do
            if [ -d "$SRC/$KIND" ]; then TARGETS+=(--target "$SRC/$KIND"); fi
          done
          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "No Apex in this release." >> "$SA_REPORT"
          else
            echo "Installing Salesforce Code Analyzer"
            sf plugins inspect code-analyzer > /dev/null 2>&1 || sf plugins install code-analyzer > "$SA_WORK/install-ca.log" 2>&1
            echo "Running PMD on the Apex"
            printf '%s\n' 'engines:' '  flow:' '    disable_engine: true' > "$SA_WORK/code-analyzer.yml"
            sf code-analyzer run --workspace "$SRC" "${TARGETS[@]}" --rule-selector "pmd:Recommended" --config-file "$SA_WORK/code-analyzer.yml" --output-file "$SA_DIR/code-analyzer.json" > "$SA_WORK/ca.log" 2>&1
            if [ -s "$SA_DIR/code-analyzer.json" ]; then
              jq -r --arg root "$(cd "$SRC" && pwd)/" --arg rel "$SRC/" '[(.violations // [])[] | select(.engine == "pmd")] as $v | if ($v | length) == 0 then "No violations found." else "\($v | length) violation(s). Severity 1 is critical, 2 high, 3 moderate, 4 low, 5 info.\n", ($v | sort_by(.severity) | .[0:200][] | (.locations[.primaryLocationIndex // 0] // {}) as $l | "- [severity \(.severity)] \(($l.file // "?") | ltrimstr($root) | ltrimstr($rel)):\($l.startLine // "?") \(.rule): \((.message // "") | gsub("\\s+"; " "))") end' "$SA_DIR/code-analyzer.json" >> "$SA_REPORT" 2> "$SA_WORK/ca-jq.log" || echo "The Code Analyzer report could not be read." >> "$SA_REPORT"
            else
              echo "Code Analyzer did not run, so the Apex was not analysed:" >> "$SA_REPORT"
              echo >> "$SA_REPORT"
              tail -n 8 "$SA_WORK/ca.log" "$SA_WORK/install-ca.log" 2> /dev/null | sed 's/^/    /' >> "$SA_REPORT"
              echo "::warning::Code Analyzer did not run: $(tail -n 3 "$SA_WORK/ca.log" 2> /dev/null)"
            fi
          fi
          {
            echo
            echo "## Lightning Web Components: ESLint (@salesforce/eslint-config-lwc)"
            echo
          } >> "$SA_REPORT"
          LWC="$SRC/LightningComponentBundle"
          if [ ! -d "$LWC" ] || [ -z "$(find "$LWC" -type f -name '*.js' | head -n 1)" ]; then
            echo "No Lightning Web Component JavaScript in this release." >> "$SA_REPORT"
          else
            ESL="$RUNNER_TEMP/sd-eslint"
            if [ ! -x "$ESL/node_modules/.bin/eslint" ]; then
              echo "Installing ESLint and @salesforce/eslint-config-lwc"
              mkdir -p "$ESL" && (cd "$ESL" && npm init -y > /dev/null 2>&1 && npm i --no-audit --no-fund "eslint@8" "@salesforce/eslint-config-lwc@3" > "$SA_WORK/install-eslint.log" 2>&1)
            fi
            printf '%s' '{"root":true,"extends":["@salesforce/eslint-config-lwc/recommended"],"settings":{"jest":{"version":29}}}' > "$ESL/.eslintrc.json"
            echo "Running ESLint on the Lightning Web Components"
            "$ESL/node_modules/.bin/eslint" --no-eslintrc --config "$ESL/.eslintrc.json" --resolve-plugins-relative-to "$ESL" --format json --output-file "$SA_DIR/eslint.json" "$LWC" > "$SA_WORK/eslint.log" 2>&1
            if [ -s "$SA_DIR/eslint.json" ]; then
              jq -r --arg root "$(cd "$LWC" && pwd)/" '[.[] | .filePath as $f | .messages[] | . + {file: ($f | ltrimstr($root))}] as $m | if ($m | length) == 0 then "No problems found." else "\($m | length) problem(s).\n", ($m | sort_by(-.severity) | .[0:200][] | "- [\(if .severity == 2 then "error" else "warning" end)] LightningComponentBundle/\(.file):\(.line // "?") \(.ruleId // "parsing"): \((.message // "") | gsub("\\s+"; " "))") end' "$SA_DIR/eslint.json" >> "$SA_REPORT" 2> "$SA_WORK/eslint-jq.log" || echo "The ESLint report could not be read." >> "$SA_REPORT"
            else
              echo "ESLint did not run, so the components were not analysed:" >> "$SA_REPORT"
              echo >> "$SA_REPORT"
              tail -n 8 "$SA_WORK/eslint.log" "$SA_WORK/install-eslint.log" 2> /dev/null | sed 's/^/    /' >> "$SA_REPORT"
              echo "::warning::ESLint did not run: $(tail -n 3 "$SA_WORK/eslint.log" 2> /dev/null)"
            fi
          fi
          echo "Static analysis written to $SA_REPORT"
          cat "$SA_REPORT"
          true

      - name: Answer the project prompts
        if: ${{ github.event.inputs.task == 'prompts' }}
        timeout-minutes: 60
        run: |
          unset ANTHROPIC_API_KEY
          rm -rf "$FOLDER/answers"
          mkdir -p "$FOLDER/answers"
          CONTEXT="You are reviewing the Salesforce release \"$RELEASE\". Its manifest is $FOLDER/package.xml, anything being deleted is in $FOLDER/destructiveChanges.xml, and the source of every component it carries is under $FOLDER/metadata/ — already merged where a merge was needed, so it is what will actually be deployed. Base your answer on those files. Do not review anything outside $FOLDER, and say so plainly if what you were asked cannot be answered from them."
          STATIC=""
          if [ -s "$FOLDER/analysis/static-analysis.md" ]; then
            STATIC=$(printf '%s\n\n%s' "Deterministic static analysis already ran on those same files: PMD through Salesforce Code Analyzer for the Apex and ESLint with @salesforce/eslint-config-lwc for the Lightning Web Components. Its report follows, and the raw results are $FOLDER/analysis/code-analyzer.json and $FOLDER/analysis/eslint.json. Treat its findings as facts: use them as evidence, explain the ones that matter for this release and what to do about them, and do not contradict a finding without reading the code it points at." "$(head -c 40000 "$FOLDER/analysis/static-analysis.md")")
          fi
          FORMAT='Answer format. The screen lays your answer out from these headings, so follow it exactly. Markdown only: no HTML, no tables, no preamble, no closing remarks. Start with "## Summary" and one to three sentences that answer the question directly. When the question is about problems, risks or quality, add "## Findings" with one bullet per finding, most severe first, each written as: - [HIGH] `ApexClass/Name.cls:42` Short title: what is wrong and what to do. The tag is one of CRITICAL, HIGH, MEDIUM, LOW or INFO; the location is the file under the metadata folder of the release and its line, left out when there is none. Write "- None." under Findings when nothing was found. Put what the summary cannot carry under "## Details", in short paragraphs or bullets, and concrete actions under "## Next steps" as a bullet list. Leave out a section that would be empty, except Summary. Keep these headings in English exactly as written and write everything else in the language of the question. Be brief: at most 25 bullets in all, and a code block only to quote a line that matters.'
          FAILED=0
          for file in "$FOLDER"/prompts/*.md; do
            [ -e "$file" ] || continue
            name=$(basename "$file" .md)
            echo "Answering $name"
            PROMPT=$(printf '%s\n\n%s\n\n%s\n\n%s' "$CONTEXT" "$STATIC" "$(cat "$file")" "$FORMAT")
            if claude -p "$PROMPT" --allowedTools "Read,Glob,Grep" --max-turns 30 > "$FOLDER/answers/$name.md" && [ -s "$FOLDER/answers/$name.md" ]; then
              echo "Answered $name"
            else
              echo "::error::Claude Code did not answer $name."
              rm -f "$FOLDER/answers/$name.md"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED prompt(s) went unanswered."
            exit 1
          fi

      - name: Complete the change record
        if: ${{ github.event.inputs.task == 'change-record' }}
        timeout-minutes: 30
        run: |
          unset ANTHROPIC_API_KEY
          BEFORE=$(sha256sum "$FOLDER/gmud.html" | cut -d' ' -f1)
          PROMPT="Read $FOLDER/package.xml and $FOLDER/gmud.html. The GMUD is a change record for release \"$RELEASE\". Its factual sections are already filled in from Salesforce. Complete only the sections left for a person to write — justification, impact analysis, rollback plan, window and communication — using the manifest as evidence. Keep the existing HTML structure and language. Change nothing that is already filled in. MANDATORY: write the result back to $FOLDER/gmud.html before you finish."
          claude -p "$PROMPT" --allowedTools "Read,Write,Edit,Glob,Grep" --permission-mode acceptEdits --max-turns 40
          AFTER=$(sha256sum "$FOLDER/gmud.html" | cut -d' ' -f1)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::error::Claude Code finished without writing the change record back to $FOLDER/gmud.html."
            exit 1
          fi

      - name: Prepare the deploy tools
        if: ${{ github.event.inputs.task == 'promote' || github.event.inputs.task == 'rollback' || github.event.inputs.task == 'restore' || github.event.inputs.task == 'snapshot' }}
        run: |
          cat > "$RUNNER_TEMP/sd-manifest.js" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const NS = 'http://soap.sforce.com/2006/04/metadata';
          const unxml = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>')
            .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
          function read(file) {
            const out = { types: new Map(), version: null };
            if (!file || !fs.existsSync(file)) { return out; }
            const xml = fs.readFileSync(file, 'utf8');
            const typeRe = /<types>([\s\S]*?)<\/types>/g;
            let m;
            while ((m = typeRe.exec(xml)) !== null) {
              const name = (/<name>([\s\S]*?)<\/name>/.exec(m[1]) || [])[1];
              if (!name) { continue; }
              const set = out.types.get(name.trim()) || new Set();
              const memberRe = /<members>([\s\S]*?)<\/members>/g;
              let k;
              while ((k = memberRe.exec(m[1])) !== null) { set.add(k[1].trim()); }
              out.types.set(name.trim(), set);
            }
            const v = /<version>([\s\S]*?)<\/version>/.exec(xml);
            out.version = v ? v[1].trim() : null;
            return out;
          }
          function write(file, manifest, withVersion) {
            const lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<Package xmlns="' + NS + '">'];
            for (const name of [...manifest.types.keys()].sort()) {
              const members = [...manifest.types.get(name)].sort();
              if (!members.length) { continue; }
              lines.push('    <types>');
              for (const member of members) { lines.push('        <members>' + member + '</members>'); }
              lines.push('        <name>' + name + '</name>', '    </types>');
            }
            if (withVersion && manifest.version) { lines.push('    <version>' + manifest.version + '</version>'); }
            lines.push('</Package>', '');
            fs.writeFileSync(file, lines.join('\n'));
          }
          const count = (manifest) => [...manifest.types.values()].reduce((n, s) => n + s.size, 0);
          const [mode, ...args] = process.argv.slice(2);
          if (mode === 'union') {
            const [outFile, ...inputs] = args;
            const merged = { types: new Map(), version: null };
            for (const input of inputs) {
              const one = read(input);
              merged.version = merged.version || one.version;
              for (const [name, set] of one.types) {
                const into = merged.types.get(name) || new Set();
                set.forEach((member) => into.add(member));
                merged.types.set(name, into);
              }
            }
            write(outFile, merged, true);
            console.log(count(merged));
          } else if (mode === 'prune') {
            const [resultFile, dir, releaseFile] = args;
            let files = [];
            try { files = [].concat(JSON.parse(fs.readFileSync(resultFile, 'utf8')).result.files || []); } catch (e) { files = []; }
            const missing = new Set(files.filter((f) => f.state === 'Failed').map((f) => f.type + '|' + f.fullName));
            const snapshot = read(path.join(dir, 'package.xml'));
            const release = read(releaseFile);
            const created = { types: new Map(), version: snapshot.version };
            for (const [name, set] of snapshot.types) {
              for (const member of [...set]) {
                if (!missing.has(name + '|' + unxml(member))) { continue; }
                set.delete(member);
                if (release.types.has(name) && release.types.get(name).has(member)) {
                  const into = created.types.get(name) || new Set();
                  into.add(member);
                  created.types.set(name, into);
                }
              }
            }
            write(path.join(dir, 'package.xml'), snapshot, true);
            if (count(created) > 0) { write(path.join(dir, 'destructiveChangesPost.xml'), created, false); }
            console.log('Snapshot holds ' + count(snapshot) + ' component(s); ' + count(created) + ' would be new.');
          } else if (mode === 'overlay') {
            const [dir, source, indexFile] = args;
            if (!fs.existsSync(indexFile)) { process.exit(0); }
            const listed = fs.readFileSync(indexFile, 'utf8').split('\n').map((s) => s.trim()).filter((s) => s && !s.startsWith('#'));
            for (const line of listed) {
              const removed = line.startsWith("- ");
              const rel = removed ? line.slice(2).trim() : line;
              if (rel.split("/").includes("..")) { continue; }
              if (removed) {
                const gone = path.join(dir, path.dirname(rel));
                const plainName = (s) => { try { return decodeURIComponent(s); } catch (e) { return s; } };
                if (fs.existsSync(gone)) {
                  for (const existing of fs.readdirSync(gone)) {
                    if (plainName(existing) === plainName(path.basename(rel))) {
                      fs.rmSync(path.join(gone, existing), { recursive: true, force: true });
                      console.log("Removed " + rel + " as the merge decided");
                    }
                  }
                }
                continue;
              }
              const from = path.join(source, rel);
              if (!fs.existsSync(from)) { console.log('::warning::Merged file missing: ' + rel); continue; }
              const folder = path.join(dir, path.dirname(rel));
              fs.mkdirSync(folder, { recursive: true });
              const plain = (s) => { try { return decodeURIComponent(s); } catch (e) { return s; } };
              const wanted = path.basename(rel);
              let name = wanted;
              for (const existing of fs.readdirSync(folder)) {
                if (plain(existing) === plain(wanted)) { name = existing; break; }
              }
              fs.copyFileSync(from, path.join(folder, name));
              console.log('Merged ' + rel + ' over ' + path.join(path.dirname(rel), name));
            }
          } else if (mode === 'select') {
            const [dir, optionsFile] = args;
            let chosen = [];
            try { chosen = [].concat(JSON.parse(fs.readFileSync(optionsFile, 'utf8')).components || []); } catch (e) { chosen = []; }
            const keep = new Set(chosen.map((c) => String(c).trim()));
            for (const name of ['package.xml', 'destructiveChanges.xml', 'destructiveChangesPost.xml']) {
              const file = path.join(dir, name);
              if (!fs.existsSync(file)) { continue; }
              const one = read(file);
              for (const [type, set] of one.types) {
                for (const member of [...set]) { if (!keep.has(type + ':' + unxml(member))) { set.delete(member); } }
              }
              if (name !== 'package.xml' && count(one) === 0) { fs.unlinkSync(file); continue; }
              write(file, one, name === 'package.xml');
            }
            const left = read(path.join(dir, 'package.xml'));
            console.log('Kept ' + count(left) + ' component(s) of the ' + keep.size + ' chosen.');
          }
          NODE
          cat > "$RUNNER_TEMP/sd-xml.js" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const NS = "http://soap.sforce.com/2006/04/metadata";
          const Q = String.fromCharCode(34);
          const A = String.fromCharCode(39);
          const ROOTS = { layout: "Layout", profile: "Profile", permissionset: "PermissionSet", permissionsetgroup: "PermissionSetGroup", object: "CustomObject", flow: "Flow", flexipage: "FlexiPage", app: "CustomApplication", tab: "CustomTab", labels: "CustomLabels", workflow: "Workflow", sharingRules: "SharingRules", globalValueSet: "GlobalValueSet", standardValueSet: "StandardValueSet", objectTranslation: "CustomObjectTranslation", translation: "Translations", customPermission: "CustomPermission", md: "CustomMetadata", quickAction: "QuickAction" };
          const CONTAINERS = new Set(["object", "workflow", "sharingRules", "labels", "assignmentRules", "autoResponseRules", "escalationRules", "matchingRule"]);
          const CHILDREN = { CustomField: "fields", ValidationRule: "validationRules", ListView: "listViews", RecordType: "recordTypes", WebLink: "webLinks", FieldSet: "fieldSets", CompactLayout: "compactLayouts", BusinessProcess: "businessProcesses", CustomLabel: "labels" };
          const FILES = { ApexClass: ["classes", ".cls"], ApexTrigger: ["triggers", ".trigger"], ApexPage: ["pages", ".page"], ApexComponent: ["components", ".component"], StaticResource: ["staticresources", ".resource"], LightningComponentBundle: ["lwc", ""], AuraDefinitionBundle: ["aura", ""], Layout: ["layouts", ".layout"], Profile: ["profiles", ".profile"], PermissionSet: ["permissionsets", ".permissionset"], PermissionSetGroup: ["permissionsetgroups", ".permissionsetgroup"], CustomObject: ["objects", ".object"], FlexiPage: ["flexipages", ".flexipage"], Flow: ["flows", ".flow"], CustomTab: ["tabs", ".tab"], CustomApplication: ["applications", ".app"], CustomPermission: ["customPermissions", ".customPermission"], CustomMetadata: ["customMetadata", ".md"], GlobalValueSet: ["globalValueSets", ".globalValueSet"], QuickAction: ["quickActions", ".quickAction"], RemoteSiteSetting: ["remoteSiteSettings", ".remoteSite"], NamedCredential: ["namedCredentials", ".namedCredential"] };
          const decode = (s) => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, Q).replace(/&apos;/g, A).replace(/&amp;/g, "&");
          const plain = (s) => { try { return decodeURIComponent(s); } catch (e) { return s; } };
          function parse(xml) {
            const re = /<!--[\s\S]*?-->|<!\[CDATA\[[\s\S]*?\]\]>|<\?[\s\S]*?\?>|<(\/?)([A-Za-z_][\w.:-]*)[^>]*?(\/?)>/g;
            const kids = [];
            let depth = 0, root = null, head = null, start = -1, name = null, m;
            while ((m = re.exec(xml)) !== null) {
              if (!m[2]) { continue; }
              if (m[1] !== "/") {
                if (depth === 0) {
                  root = m[2];
                  head = xml.slice(0, re.lastIndex);
                  if (m[3] === "/") { head = head.slice(0, -2) + ">"; break; }
                  depth = 1;
                  continue;
                }
                if (depth === 1) { start = m.index; name = m[2]; }
                if (m[3] === "/") {
                  if (depth === 1) { kids.push({ name: name, text: xml.slice(start, re.lastIndex) }); }
                  continue;
                }
                depth++;
              } else {
                depth--;
                if (depth === 1) { kids.push({ name: name, text: xml.slice(start, re.lastIndex) }); }
                if (depth === 0) { break; }
              }
            }
            return root ? { root: root, head: head, kids: kids } : null;
          }
          function keyOf(kid, tag) {
            if (!tag) { return null; }
            const inner = kid.text.slice(kid.text.indexOf(">") + 1);
            const m = new RegExp("<" + tag + ">([^<]*)</" + tag + ">").exec(inner);
            return m ? decode(m[1].trim()) : null;
          }
          function fragment(xml) {
            const lines = String(xml).trim().split(/\r?\n/);
            const rest = lines.slice(1).filter((l) => l.trim());
            const cut = rest.length ? Math.min(...rest.map((l) => l.length - l.trimStart().length)) : 0;
            return [lines[0].trim()].concat(lines.slice(1).map((l) => (l.trim() ? "    " + l.slice(cut) : ""))).join("\n");
          }
          function render(doc) {
            const body = doc.kids.map((k) => "    " + k.text).join("\n");
            return doc.head + "\n" + (body ? body + "\n" : "") + "</" + doc.root + ">\n";
          }
          function insert(doc, fresh, keyTag, keyValue) {
            const same = [];
            doc.kids.forEach((k, i) => { if (k.name === fresh.name) { same.push(i); } });
            let at = -1;
            if (same.length) {
              at = same[same.length - 1] + 1;
              if (keyTag) {
                for (const i of same) {
                  const key = keyOf(doc.kids[i], keyTag);
                  if (key !== null && key > keyValue) { at = i; break; }
                }
              }
            } else {
              at = doc.kids.findIndex((k) => k.name > fresh.name);
              if (at < 0) { at = doc.kids.length; }
            }
            doc.kids.splice(at, 0, fresh);
          }
          function apply(doc, el) {
            const matches = doc.kids.filter((k) => k.name === el.tag && (!el.keyTag || keyOf(k, el.keyTag) === String(el.keyValue)));
            if (el.xml === null || el.xml === undefined) {
              doc.kids = doc.kids.filter((k) => !matches.includes(k));
              return matches.length ? "removed" : "already absent";
            }
            const fresh = { name: el.tag, text: fragment(el.xml) };
            if (matches.length) {
              doc.kids[doc.kids.indexOf(matches[0])] = fresh;
              doc.kids = doc.kids.filter((k) => !matches.slice(1).includes(k));
              return "replaced";
            }
            insert(doc, fresh, el.keyTag, String(el.keyValue));
            return "inserted";
          }
          function resolve(dir, rel) {
            const folder = path.join(dir, path.dirname(rel));
            const wanted = path.basename(rel);
            if (fs.existsSync(folder)) {
              for (const existing of fs.readdirSync(folder)) {
                if (plain(existing) === plain(wanted)) { return path.join(folder, existing); }
              }
            }
            return path.join(folder, wanted);
          }
          function members(xml) {
            const out = [];
            const typeRe = /<types>([\s\S]*?)<\/types>/g;
            let m;
            while ((m = typeRe.exec(xml)) !== null) {
              const type = ((/<name>([\s\S]*?)<\/name>/.exec(m[1]) || [])[1] || "").trim();
              const memberRe = /<members>([\s\S]*?)<\/members>/g;
              let k;
              while (type && (k = memberRe.exec(m[1])) !== null) { out.push({ type: type, name: k[1].trim() }); }
            }
            return out;
          }
          function writeManifest(file, list, version) {
            const byType = new Map();
            for (const one of list) { byType.set(one.type, (byType.get(one.type) || new Set()).add(one.name)); }
            const lines = ["<?xml version=" + Q + "1.0" + Q + " encoding=" + Q + "UTF-8" + Q + "?>", "<Package xmlns=" + Q + NS + Q + ">"];
            for (const type of [...byType.keys()].sort()) {
              lines.push("    <types>");
              for (const name of [...byType.get(type)].sort()) { lines.push("        <members>" + name + "</members>"); }
              lines.push("        <name>" + type + "</name>", "    </types>");
            }
            if (version) { lines.push("    <version>" + version + "</version>"); }
            lines.push("</Package>", "");
            fs.writeFileSync(file, lines.join("\n"));
          }
          const [mode, ...args] = process.argv.slice(2);
          if (mode === "precision") {
            const [dir, file] = args;
            if (!fs.existsSync(file)) { process.exit(0); }
            let entries = [];
            try { entries = [].concat(JSON.parse(fs.readFileSync(file, "utf8")) || []); } catch (e) {
              console.log("::warning::The precision file could not be read: " + e.message);
              process.exit(0);
            }
            for (const entry of entries) {
              if (!entry || !entry.path || path.isAbsolute(entry.path) || entry.path.split("/").includes("..")) { continue; }
              const target = resolve(dir, entry.path);
              let doc = fs.existsSync(target) ? parse(fs.readFileSync(target, "utf8")) : null;
              if (!doc) {
                const root = entry.root || ROOTS[entry.path.split(".").pop()];
                if (!root) { console.log("::warning::No file at " + entry.path + " and no root element known for it."); continue; }
                doc = { root: root, head: "<?xml version=" + Q + "1.0" + Q + " encoding=" + Q + "UTF-8" + Q + "?>\n<" + root + " xmlns=" + Q + NS + Q + ">", kids: [] };
                fs.mkdirSync(path.dirname(target), { recursive: true });
              }
              for (const el of [].concat(entry.elements || [])) {
                if (!el || !el.tag) { continue; }
                console.log(entry.path + ": " + el.tag + (el.keyTag ? " " + el.keyValue : "") + " " + apply(doc, el));
              }
              fs.writeFileSync(target, render(doc));
            }
          } else if (mode === "flowstatus") {
            const [dir, status] = args;
            const folder = path.join(dir, "flows");
            if (!["Active", "Draft"].includes(status) || !fs.existsSync(folder)) { process.exit(0); }
            for (const name of fs.readdirSync(folder).filter((f) => f.endsWith(".flow"))) {
              const file = path.join(folder, name);
              const doc = parse(fs.readFileSync(file, "utf8"));
              if (!doc) { continue; }
              apply(doc, { tag: "status", keyTag: null, keyValue: null, xml: "<status>" + status + "</status>" });
              fs.writeFileSync(file, render(doc));
              console.log("Flow " + name + " will be deployed as " + status);
            }
          } else if (mode === "flownames" || mode === "flowdelete") {
            const [dir, versionsFile] = args;
            const DELETIONS = ["destructiveChangesPost.xml", "destructiveChanges.xml"];
            const flows = new Set();
            for (const name of DELETIONS) {
              const file = path.join(dir, name);
              if (!fs.existsSync(file)) { continue; }
              for (const m of members(fs.readFileSync(file, "utf8"))) {
                if (m.type === "Flow" && /^[A-Za-z0-9_]+$/.test(decode(m.name))) { flows.add(decode(m.name)); }
              }
            }
            if (mode === "flownames") {
              console.log([...flows].map((f) => A + f + A).join(","));
              process.exit(0);
            }
            if (flows.size === 0) { process.exit(0); }
            const versions = new Map();
            try {
              const rows = (JSON.parse(fs.readFileSync(versionsFile, "utf8")).result || {}).records || [];
              for (const row of rows) {
                const flow = row.Definition && row.Definition.DeveloperName;
                if (!flow) { continue; }
                if (!versions.has(flow)) { versions.set(flow, []); }
                versions.get(flow).push(row.VersionNumber);
              }
            } catch (e) {
              console.log("::warning::The flow versions in the target could not be listed, so the flows are deleted by name: " + e.message);
            }
            for (const name of DELETIONS) {
              const file = path.join(dir, name);
              if (!fs.existsSync(file)) { continue; }
              const text = fs.readFileSync(file, "utf8");
              const list = [];
              for (const m of members(text)) {
                const known = m.type === "Flow" ? versions.get(decode(m.name)) : null;
                if (!known || known.length === 0) { list.push(m); continue; }
                for (const n of known) { list.push({ type: "Flow", name: m.name + "-" + n }); }
                console.log("Flow " + decode(m.name) + " is deleted as its " + known.length + " version(s)");
              }
              writeManifest(file, list, (/<version>([^<]*)<\/version>/.exec(text) || [])[1]);
            }
            for (const flow of [...flows]) { if (!versions.has(flow)) { flows.delete(flow); } }
            if (flows.size === 0) { process.exit(0); }
            const manifestFile = path.join(dir, "package.xml");
            const manifest = fs.existsSync(manifestFile) ? fs.readFileSync(manifestFile, "utf8") : "";
            const version = (/<version>([^<]*)<\/version>/.exec(manifest) || [])[1] || "67.0";
            const kept = manifest ? members(manifest) : [];
            fs.mkdirSync(path.join(dir, "flowDefinitions"), { recursive: true });
            for (const flow of flows) {
              fs.writeFileSync(path.join(dir, "flowDefinitions", flow + ".flowDefinition"),
                "<?xml version=" + Q + "1.0" + Q + " encoding=" + Q + "UTF-8" + Q + "?>\n<FlowDefinition xmlns=" + Q + NS + Q + ">\n" +
                "    <activeVersionNumber>0</activeVersionNumber>\n</FlowDefinition>\n");
              if (!kept.some((k) => k.type === "FlowDefinition" && k.name === flow)) { kept.push({ type: "FlowDefinition", name: flow }); }
              console.log("Flow " + flow + " is deactivated before it is deleted");
            }
            writeManifest(manifestFile, kept, version);
          } else if (mode === "packageversions") {
            const [dir, file] = args;
            let installed = null;
            try { installed = [].concat(JSON.parse(fs.readFileSync(file, "utf8")).result || []); } catch (e) { installed = null; }
            if (!installed) {
              console.log("::warning::The packages installed in the target could not be listed, so package version references were left as the source org wrote them.");
              process.exit(0);
            }
            const have = new Map();
            for (const p of installed) {
              if (p.SubscriberPackageNamespace) { have.set(p.SubscriberPackageNamespace, String(p.SubscriberPackageVersionNumber || "").split(".")); }
            }
            const block = /[ \t]*<packageVersions>[\s\S]*?<\/packageVersions>\r?\n?/g;
            const walk = (d) => {
              for (const entry of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, entry.name);
                if (entry.isDirectory()) { walk(p); continue; }
                if (!entry.name.endsWith("-meta.xml")) { continue; }
                const before = fs.readFileSync(p, "utf8");
                if (!before.includes("<packageVersions>")) { continue; }
                const after = before.replace(block, (found) => {
                  const ns = (/<namespace>([^<]*)<\/namespace>/.exec(found) || [])[1];
                  const at = have.get(ns);
                  if (!at || at.length < 2) {
                    console.log(entry.name + ": dropped the reference to package " + ns + ", which the target does not have");
                    return "";
                  }
                  return found.replace(/<majorNumber>[^<]*<\/majorNumber>/, "<majorNumber>" + at[0] + "</majorNumber>")
                    .replace(/<minorNumber>[^<]*<\/minorNumber>/, "<minorNumber>" + at[1] + "</minorNumber>");
                });
                if (after !== before) { fs.writeFileSync(p, after); console.log(entry.name + ": package versions set to what the target has"); }
              }
            };
            if (fs.existsSync(dir)) { walk(dir); }
          } else if (mode === "absorb") {
            const [from, into] = args;
            const walk = (rel) => {
              for (const entry of fs.readdirSync(path.join(from, rel), { withFileTypes: true })) {
                const r = path.join(rel, entry.name);
                if (entry.isDirectory()) { fs.mkdirSync(path.join(into, r), { recursive: true }); walk(r); continue; }
                if (r === "package.xml" || r.startsWith("destructiveChanges")) { continue; }
                const target = path.join(into, r);
                const old = CONTAINERS.has(entry.name.split(".").pop()) && fs.existsSync(target) ? parse(fs.readFileSync(target, "utf8")) : null;
                const fresh = old ? parse(fs.readFileSync(path.join(from, r), "utf8")) : null;
                if (!old || !fresh) { fs.copyFileSync(path.join(from, r), target); continue; }
                const settings = new Set(fresh.kids.filter((k) => keyOf(k, "fullName") === null).map((k) => k.name));
                old.kids = old.kids.filter((k) => !settings.has(k.name));
                for (const kid of fresh.kids) {
                  const key = keyOf(kid, "fullName");
                  if (key === null) { insert(old, { name: kid.name, text: fragment(kid.text) }, null, null); continue; }
                  apply(old, { tag: kid.name, keyTag: "fullName", keyValue: key, xml: kid.text });
                }
                fs.writeFileSync(target, render(old));
              }
            };
            fs.mkdirSync(into, { recursive: true });
            walk("");
          } else if (mode === "forget") {
            const [base, removedFile] = args;
            const manifestFile = path.join(base, "package.xml");
            if (!fs.existsSync(removedFile) || !fs.existsSync(manifestFile)) { process.exit(0); }
            const removed = members(fs.readFileSync(removedFile, "utf8"));
            const gone = new Set(removed.map((r) => r.type + "|" + r.name));
            const manifest = fs.readFileSync(manifestFile, "utf8");
            const version = (/<version>([^<]*)<\/version>/.exec(manifest) || [])[1];
            writeManifest(manifestFile, members(manifest).filter((k) => !gone.has(k.type + "|" + k.name)), version);
            for (const r of removed) {
              const name = decode(r.name);
              if (CHILDREN[r.type]) {
                const label = r.type === "CustomLabel";
                const file = path.join(base, label ? "labels/CustomLabels.labels" : "objects/" + name.split(".")[0] + ".object");
                const doc = fs.existsSync(file) ? parse(fs.readFileSync(file, "utf8")) : null;
                if (!doc) { continue; }
                apply(doc, { tag: CHILDREN[r.type], keyTag: "fullName", keyValue: label ? name : name.slice(name.indexOf(".") + 1), xml: null });
                fs.writeFileSync(file, render(doc));
              } else if (FILES[r.type]) {
                const target = resolve(base, FILES[r.type][0] + "/" + name + FILES[r.type][1]);
                fs.rmSync(target, { recursive: true, force: true });
                fs.rmSync(target + "-meta.xml", { force: true });
              }
              console.log("The baseline no longer holds " + r.type + " " + name);
            }
          }
          NODE

      - name: Deploy to the target org
        if: ${{ github.event.inputs.task == 'promote' }}
        timeout-minutes: 115
        env:
          SD_HUB_AUTH_URL: ${{ secrets.SD_HUB_AUTH_URL }}
          SF_AUTH_ACCOUNT: ${{ secrets.SF_AUTH_ACCOUNT }}
          SF_AUTH_PARTIAL: ${{ secrets.SF_AUTH_PARTIAL }}
        run: |
          set +e
          mkdir -p "$FOLDER/deploy"
          RESULT="$FOLDER/deploy/$STEP.json"
          CODE_FILE="$FOLDER/deploy/$STEP.code"
          WORK="$RUNNER_TEMP/smart-deploy"
          rm -rf "$WORK" && mkdir -p "$WORK"
          RUN_FILE="$FOLDER/run/$STEP.$TASK.json"
          fail() {
            echo "ERROR: $1"
            jq -n --arg m "$1" '{status: 1, name: "SmartDeployError", message: $m}' > "$RESULT"
            echo 1 > "$CODE_FILE"
            exit 1
          }
          login() {
            if [ -z "$2" ]; then fail "No $1 credential was named. Set a Deploy Secret Name or a Token Credential on that environment."; fi
            case "$2" in
              sd-ticket:*)
                if [ -z "${SD_HUB_AUTH_URL:-}" ]; then fail "The $1 credential is kept by the Smart Deploy hub, and the runner has no SD_HUB_AUTH_URL secret to reach it. Create a repository secret of that name holding the hub org sfdx auth URL."; fi
                HUB_AUTH="${SD_HUB_AUTH_URL#force://}"
                HUB_CLIENT="${HUB_AUTH%%:*}"; HUB_AUTH="${HUB_AUTH#*:}"
                HUB_CLIENT_SECRET="${HUB_AUTH%%:*}"; HUB_AUTH="${HUB_AUTH#*:}"
                HUB_REFRESH="${HUB_AUTH%@*}"; HUB_HOST="${HUB_AUTH##*@}"
                case "$HUB_HOST" in http*) HUB_BASE="$HUB_HOST" ;; *) HUB_BASE="https://$HUB_HOST" ;; esac
                if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::add-mask::$HUB_REFRESH"; fi
                curl -sS -o "$WORK/hub-token.json" -X POST "$HUB_BASE/services/oauth2/token" --data-urlencode "grant_type=refresh_token" --data-urlencode "client_id=$HUB_CLIENT" ${HUB_CLIENT_SECRET:+--data-urlencode "client_secret=$HUB_CLIENT_SECRET"} --data-urlencode "refresh_token=$HUB_REFRESH"
                HUB_TOKEN=$(jq -r ".access_token // empty" "$WORK/hub-token.json" 2> /dev/null)
                HUB_URL=$(jq -r ".instance_url // empty" "$WORK/hub-token.json" 2> /dev/null)
                HUB_REFUSED=$(jq -r ".error_description // .error // empty" "$WORK/hub-token.json" 2> /dev/null)
                rm -f "$WORK/hub-token.json"
                unset HUB_AUTH HUB_REFRESH HUB_CLIENT_SECRET
                if [ -z "$HUB_TOKEN" ] || [ -z "$HUB_URL" ]; then fail "The hub org refused the SD_HUB_AUTH_URL credential. ${HUB_REFUSED}"; fi
                if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::add-mask::$HUB_TOKEN"; fi
                jq -n --arg t "${2#sd-ticket:}" "{ticket: \$t}" > "$WORK/ticket.json"
                HTTP=$(curl -sS -o "$WORK/token.json" -w "%{http_code}" -X POST "$HUB_URL/services/apexrest/smartcloudbrc/SmartDeploy/Token" -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" --data @"$WORK/ticket.json")
                rm -f "$WORK/ticket.json"
                ACCESS=$(jq -r ".accessToken // empty" "$WORK/token.json" 2> /dev/null)
                INSTANCE=$(jq -r ".instanceUrl // empty" "$WORK/token.json" 2> /dev/null)
                if [ -n "$ACCESS" ] && [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::add-mask::$ACCESS"; fi
                REFUSED=$(jq -r ".error // empty" "$WORK/token.json" 2> /dev/null)
                rm -f "$WORK/token.json"
                if [ -z "$ACCESS" ] || [ -z "$INSTANCE" ]; then fail "The hub did not hand over the $1 credential (HTTP $HTTP). ${REFUSED}"; fi
                SF_ACCESS_TOKEN="$ACCESS" sf org login access-token --instance-url "$INSTANCE" --alias "$1" --no-prompt > /dev/null || fail "The $1 org refused the token the hub handed over."
                unset ACCESS HUB_TOKEN
                ;;
              *)
                AUTH_URL="${!2:-}"
                if [ -z "$AUTH_URL" ]; then fail "No credential behind '$2'. Create a repository secret of exactly that name holding the org sfdx auth URL, then run the step again."; fi
                printf "%s" "$AUTH_URL" > "$WORK/auth.txt"
                sf org login sfdx-url --sfdx-url-file "$WORK/auth.txt" --alias "$1" > /dev/null || { rm -f "$WORK/auth.txt"; fail "The $1 org refused the credential in '$2'."; }
                rm -f "$WORK/auth.txt"
                ;;
            esac
          }
          if [ ! -f "$FOLDER/package.xml" ]; then fail "No manifest at $FOLDER/package.xml. Generate the release documentation first."; fi
          login target "$AUTH_SECRET"

          if [ "$VALIDATE_ONLY" != "true" ]; then
            echo "Snapshotting the target for rollback"
            MEMBERS=$(node "$RUNNER_TEMP/sd-manifest.js" union "$WORK/snapshot.xml" "$FOLDER/package.xml" "$FOLDER/destructiveChanges.xml" "$FOLDER/destructiveChangesPre.xml")
            rm -rf "$FOLDER/rollback/$STEP" && mkdir -p "$FOLDER/rollback/$STEP"
            if [ "$MEMBERS" -gt 0 ]; then
              sf project retrieve start --manifest "$WORK/snapshot.xml" --target-org target --target-metadata-dir "$WORK/snapshot" --unzip --single-package --zip-file-name pkg --wait 20 --json > "$WORK/snapshot.json" || fail "Could not snapshot the target org: $(jq -r '.message // "see the log"' "$WORK/snapshot.json")"
              cp -R "$WORK/snapshot/pkg/." "$FOLDER/rollback/$STEP/"
            else
              cp "$WORK/snapshot.xml" "$FOLDER/rollback/$STEP/package.xml"
            fi
            node "$RUNNER_TEMP/sd-manifest.js" prune "$WORK/snapshot.json" "$FOLDER/rollback/$STEP" "$FOLDER/package.xml"
          fi

          FULL_DEPLOY=true
          if [ -n "$QUICK_DEPLOY_ID" ]; then
            echo "Quick-deploying the validated job $QUICK_DEPLOY_ID"
            sf project deploy quick --job-id "$QUICK_DEPLOY_ID" --target-org target --wait 60 --json > "$RESULT"
            CODE=$?
            if [ "$CODE" -eq 0 ]; then
              FULL_DEPLOY=false
            else
              echo "::warning::The validation could not be quick-deployed ($(jq -r '.message // "no reason given"' "$RESULT" 2>/dev/null)). Deploying the release in full instead."
            fi
          fi
          if [ "$FULL_DEPLOY" = "true" ]; then
            login source "$SOURCE_SECRET"
            DEPLOY_DIR="$WORK/source/pkg"
            if grep -q '<members>' "$FOLDER/package.xml"; then
              echo "Retrieving the release from the source org"
              sf project retrieve start --manifest "$FOLDER/package.xml" --target-org source --target-metadata-dir "$WORK/source" --unzip --single-package --zip-file-name pkg --wait 20 --json > "$WORK/source.json" || fail "Could not retrieve the release from the source org: $(jq -r '.message // "see the log"' "$WORK/source.json")"
            else
              mkdir -p "$DEPLOY_DIR" && cp "$FOLDER/package.xml" "$DEPLOY_DIR/package.xml"
            fi
            node "$RUNNER_TEMP/sd-manifest.js" overlay "$DEPLOY_DIR" "$FOLDER/merged" "$FOLDER/merged.index"
            node "$RUNNER_TEMP/sd-xml.js" precision "$DEPLOY_DIR" "$FOLDER/precision.json"
            FLOW_STATUS=$(jq -r '.flowStatus // empty' "$RUN_FILE" 2>/dev/null)
            if [ "$FLOW_STATUS" = "Active" ] || [ "$FLOW_STATUS" = "Draft" ]; then
              node "$RUNNER_TEMP/sd-xml.js" flowstatus "$DEPLOY_DIR" "$FLOW_STATUS"
            fi
            sf package installed list --target-org target --json > "$WORK/installed.json" 2> /dev/null || true
            node "$RUNNER_TEMP/sd-xml.js" packageversions "$DEPLOY_DIR" "$WORK/installed.json"

            FAIL_PRIORITY=$(jq -r '.analysis.failPriority // 0' "$RUN_FILE" 2>/dev/null)
            [[ "$FAIL_PRIORITY" =~ ^[0-5]$ ]] || FAIL_PRIORITY=0
            if [ "$(jq -r '.analysis.enabled' "$RUN_FILE" 2>/dev/null)" != "false" ] && [ -f "smart-deploy/_config/apex-ruleset.xml" ] && find "$DEPLOY_DIR" \( -name '*.cls' -o -name '*.trigger' \) -print -quit | grep -q .; then
              echo "Analysing the Apex in the package with PMD $PMD_VERSION"
              mkdir -p "$FOLDER/analysis"
              ANALYSIS="$FOLDER/analysis/$STEP.json"
              if ! command -v java > /dev/null; then (apt-get update -qq && apt-get install -y -qq default-jre-headless) > /dev/null 2>&1; fi
              if [ ! -x "$HOME/pmd/bin/pmd" ]; then
                curl -sSfL -o "$WORK/pmd.zip" "https://github.com/pmd/pmd/releases/download/pmd_releases%2F$PMD_VERSION/pmd-dist-$PMD_VERSION-bin.zip" && unzip -q "$WORK/pmd.zip" -d "$WORK/pmd-dist" && rm -rf "$HOME/pmd" && mv "$WORK/pmd-dist/pmd-bin-$PMD_VERSION" "$HOME/pmd"
              fi
              if [ -x "$HOME/pmd/bin/pmd" ]; then
                "$HOME/pmd/bin/pmd" check --dir "$DEPLOY_DIR" --rulesets "smart-deploy/_config/apex-ruleset.xml" --format json --report-file "$WORK/pmd.json" --no-fail-on-violation --no-cache --no-progress > "$WORK/pmd.log" 2>&1
                jq --argjson t "$FAIL_PRIORITY" --arg root "$DEPLOY_DIR/" '{tool: "pmd", threshold: $t, violations: [(.files // [])[] as $f | ($f.violations // [])[] | {file: ($f.filename | ltrimstr($root)), line: .beginline, rule: .rule, ruleset: .ruleset, priority: .priority, message: .description}]} | .count = (.violations | length) | .blocking = (if $t > 0 then ([.violations[] | select(.priority <= $t)] | length) else 0 end)' "$WORK/pmd.json" > "$ANALYSIS" || echo "::warning::PMD ran but its report could not be read: $(tail -n 3 "$WORK/pmd.log")"
                BLOCKING=$(jq -r '.blocking // 0' "$ANALYSIS" 2>/dev/null)
                echo "PMD found $(jq -r '.count // 0' "$ANALYSIS" 2>/dev/null) violation(s)."
                if [ "$FAIL_PRIORITY" -gt 0 ] && [ "${BLOCKING:-0}" -gt 0 ]; then
                  fail "Static analysis found $BLOCKING violation(s) at priority $FAIL_PRIORITY or more severe. See $ANALYSIS."
                fi
              else
                echo "::warning::PMD could not be installed, so the package was not analysed."
              fi
            fi

            if [ -f "$FOLDER/destructiveChanges.xml" ]; then
              cp "$FOLDER/destructiveChanges.xml" "$DEPLOY_DIR/destructiveChangesPost.xml"
            fi
            if [ -f "$FOLDER/destructiveChangesPre.xml" ] && grep -q '<members>' "$FOLDER/destructiveChangesPre.xml"; then
              cp "$FOLDER/destructiveChangesPre.xml" "$DEPLOY_DIR/destructiveChangesPre.xml"
            fi
            FLOWS=$(node "$RUNNER_TEMP/sd-xml.js" flownames "$DEPLOY_DIR")
            if [ -n "$FLOWS" ]; then
              sf data query --use-tooling-api --target-org target --json --query "SELECT Definition.DeveloperName, VersionNumber FROM Flow WHERE Definition.DeveloperName IN ($FLOWS)" > "$WORK/flows.json" 2> /dev/null || true
              node "$RUNNER_TEMP/sd-xml.js" flowdelete "$DEPLOY_DIR" "$WORK/flows.json"
            fi
            WARNINGS=""
            if ls "$DEPLOY_DIR"/destructiveChanges*.xml > /dev/null 2>&1; then
              WARNINGS="--ignore-warnings"
            fi
            DRY_RUN=""
            if [ "$VALIDATE_ONLY" = "true" ]; then
              DRY_RUN="--dry-run"
              echo "Validating only: nothing will be written to the org."
            fi
            TEST_ARGS=()
            if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
              TESTS_FILE="$FOLDER/tests/$STEP.txt"
              [ -f "$TESTS_FILE" ] || fail "The step runs specified tests, but no list was committed at $TESTS_FILE."
              while IFS= read -r CLASS || [ -n "$CLASS" ]; do
                CLASS="${CLASS%%#*}"
                CLASS="$(printf '%s' "$CLASS" | tr -d '[:space:]')"
                [ -z "$CLASS" ] && continue
                [[ "$CLASS" =~ ^[A-Za-z0-9_]+$ ]] || fail "\"$CLASS\" in $TESTS_FILE is not an Apex class name."
                TEST_ARGS+=(--tests "$CLASS")
