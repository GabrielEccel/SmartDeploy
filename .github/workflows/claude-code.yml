                unset HUB_AUTH HUB_REFRESH HUB_CLIENT_SECRET
                if [ -z "$HUB_TOKEN" ] || [ -z "$HUB_URL" ]; then fail "The hub org refused the SD_HUB_AUTH_URL credential. ${HUB_REFUSED}"; fi
                if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::add-mask::$HUB_TOKEN"; fi
