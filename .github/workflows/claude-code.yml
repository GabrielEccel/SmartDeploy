                HTTP=$(curl -sS -o "$WORK/token.json" -w "%{http_code}" -X POST "$HUB_URL/services/apexrest/smartcloudbrc/SmartDeploy/Token" -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" --data @"$WORK/ticket.json")
